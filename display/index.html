<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Still Safe 상태</title>
<style>
  :root {
    --bg: #0f1413;
    --panel: #18201e;
    --line: #2a3431;
    --text: #e8eeeb;
    --muted: #93a19c;
    --safe: #2fae5c;
    --caution: #d9b21f;
    --warning: #e8862a;
    --danger: #e0443a;
    --unknown: #5d6a66;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }   /* 아래 #stale 의 display:flex 보다 우선 */
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
    display: grid;
    grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr);
    grid-template-rows: minmax(0, 1fr) auto;
    gap: 10px;
    padding: 10px;
    overflow: hidden;
    user-select: none;
  }

  /* 왼쪽: 단계 */
  #level {
    grid-row: 1;
    border-radius: 14px;
    background: var(--unknown);
    color: #fff;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 16px;
    min-height: 0;
  }
  #level .num { font-size: clamp(64px, 22vh, 180px); font-weight: 800; line-height: 1; }
  #level .name { font-size: clamp(28px, 9vh, 72px); font-weight: 700; margin-top: 4px; }
  #level .reason { font-size: clamp(16px, 4.5vh, 30px); margin-top: 14px; opacity: 0.95; }
  #level.l0 { background: var(--safe); }
  #level.l1 { background: var(--caution); color: #1d1a08; }
  #level.l2 { background: var(--warning); color: #22140a; }
  #level.l3 { background: var(--danger); animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { filter: brightness(0.82); } }
  @media (prefers-reduced-motion: reduce) { #level.l3 { animation: none; } }

  /* 오른쪽: 기계, 장치, 이벤트 */
  #side { grid-row: 1; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
  .card h2 { margin: 0 0 6px; font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: 0.04em; }
  .row { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; font-size: clamp(14px, 3.6vh, 20px); }
  .pill { font-size: 0.85em; font-weight: 700; padding: 2px 10px; border-radius: 99px; background: var(--unknown); color: #fff; white-space: nowrap; }
  .pill.ok { background: var(--safe); }
  .pill.bad { background: var(--danger); }
  .pill.warn { background: var(--warning); color: #22140a; }
  #events { flex: 1; min-height: 0; overflow: hidden; }
  #events ul { list-style: none; margin: 0; padding: 0; font-size: clamp(12px, 3vh, 16px); }
  #events li { display: flex; gap: 10px; padding: 3px 0; border-bottom: 1px solid var(--line); }
  #events li:last-child { border-bottom: 0; }
  #events time { color: var(--muted); font-variant-numeric: tabular-nums; }

  /* 아래: 연결 상태 */
  #footer {
    grid-column: 1 / -1;
    display: flex; justify-content: space-between; gap: 12px;
    font-size: 12px; color: var(--muted);
  }

  /* 중앙 응답 없음 / 브로커 끊김 */
  #stale {
    position: fixed; inset: 0;
    background: rgba(10, 12, 12, 0.86);
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    text-align: center; gap: 10px; padding: 16px;
  }
  #stale b { font-size: clamp(24px, min(8vh, 9vw), 56px); color: var(--warning); }
  #stale span { font-size: clamp(14px, min(3.5vh, 4.5vw), 22px); color: var(--text); max-width: 32em; }

  /* 휴대폰 세로 화면 */
  @media (max-width: 640px) {
    body { grid-template-columns: 1fr; grid-template-rows: auto auto auto; overflow: auto; height: auto; min-height: 100%; }
    #level { min-height: 46vh; }
    #side, #level { grid-row: auto; }
  }
</style>
</head>
<body>
  <section id="level" aria-live="polite">
    <div class="num" id="lv-num">-</div>
    <div class="name" id="lv-name">연결 중</div>
    <div class="reason" id="lv-reason">중앙 상태를 기다리는 중</div>
  </section>

  <div id="side">
    <section class="card">
      <h2>기계</h2>
      <div class="row">모터 <span class="pill" id="motor">확인 중</span></div>
      <div class="row">정지 잠금 <span class="pill" id="latched">확인 중</span></div>
    </section>

    <section class="card">
      <h2>장치 연결</h2>
      <div class="row">Pi A · 손 감지 <span class="pill" id="dev-hand">확인 중</span></div>
      <div class="row">Pi B · 쓰러짐 감지 <span class="pill" id="dev-fall">확인 중</span></div>
      <div class="row">ESP32 · 기계 제어 <span class="pill" id="dev-esp32">확인 중</span></div>
    </section>

    <section class="card" id="events">
      <h2>최근 변화</h2>
      <ul id="event-list"></ul>
    </section>
  </div>

  <div id="footer">
    <span id="broker">브로커: 연결 중</span>
    <span id="updated">마지막 수신: -</span>
  </div>

  <div id="stale" hidden>
    <b id="stale-title">중앙 응답 없음</b>
    <span id="stale-text">3초 넘게 상태를 받지 못했어요. 표시된 내용은 마지막 상태예요.</span>
  </div>

<script src="mqtt.min.js"></script>
<script>
  // ---- 설정 ----
  // 주소창에 ?host=192.168.20.18 처럼 주면 그 브로커로 접속한다.
  // 없으면 이 페이지를 연 주소, 파일로 열었으면 localhost.
  const params = new URLSearchParams(location.search);
  const HOST = params.get("host") || location.hostname || "localhost";
  const PORT = Number(params.get("port") || 9001);
  const TOPIC = "stillsafe/central/state";
  const STALE_MS = 3000;       // 중앙은 1초마다 보냄. 이 시간 넘게 없으면 응답 없음
  const MAX_EVENTS = 6;

  const LEVEL_NAME = ["안전", "주의", "경고", "위험"];
  const REASON_TEXT = {
    safe: "이상 없음",
    two_people: "2인 1조 인원 부족",
    hand_middle: "손이 경고 구역에 있음",
    hand_inner: "손이 위험 구역에 있음",
    fall: "쓰러짐 감지",
    device_error: "장치 연결 이상",
  };

  const $ = (id) => document.getElementById(id);
  let lastReceived = 0;
  let lastKey = null;
  let brokerOk = false;

  function setPill(id, value, yes, no, yesClass, noClass) {
    const el = $(id);
    if (value === true) { el.textContent = yes; el.className = "pill " + yesClass; }
    else if (value === false) { el.textContent = no; el.className = "pill " + noClass; }
    else { el.textContent = "확인 중"; el.className = "pill"; }
  }

  function timeText(date) {
    return date.toLocaleTimeString("ko-KR", { hour12: false });
  }

  function addEvent(text) {
    const li = document.createElement("li");
    const t = document.createElement("time");
    t.textContent = timeText(new Date());
    const s = document.createElement("span");
    s.textContent = text;
    li.append(t, s);
    const list = $("event-list");
    list.prepend(li);
    while (list.children.length > MAX_EVENTS) list.lastChild.remove();
  }

  function show(state) {
    const level = state.level;
    const reason = REASON_TEXT[state.reason] || state.reason;

    $("level").className = "l" + level;
    $("lv-num").textContent = level;
    $("lv-name").textContent = LEVEL_NAME[level] ?? "알 수 없음";
    $("lv-reason").textContent = reason;

    setPill("motor", state.motor, "동작", "정지", "warn", "");
    setPill("latched", state.latched, "잠김", "풀림", "bad", "ok");
    const d = state.devices || {};
    setPill("dev-hand", d.hand, "정상", "끊김", "ok", "bad");
    setPill("dev-fall", d.fall, "정상", "끊김", "ok", "bad");
    setPill("dev-esp32", d.esp32, "정상", "끊김", "ok", "bad");

    const key = level + ":" + state.reason;
    if (key !== lastKey) {
      addEvent(`${level} ${LEVEL_NAME[level] ?? ""} · ${reason}`);
      lastKey = key;
    }
  }

  // 3초 넘게 상태가 없거나 브로커가 끊기면 화면을 덮는다.
  // retain 때문에 중앙이 죽어도 마지막 상태가 남아 있으므로 꼭 필요하다.
  function checkStale() {
    const stale = Date.now() - lastReceived > STALE_MS;
    if (!brokerOk) {
      $("stale-title").textContent = "브로커 연결 끊김";
      $("stale-text").textContent = `${HOST}:${PORT} 에 다시 연결하는 중이에요.`;
    } else {
      $("stale-title").textContent = "중앙 응답 없음";
      $("stale-text").textContent = "3초 넘게 상태를 받지 못했어요. 표시된 내용은 마지막 상태예요.";
    }
    $("stale").hidden = brokerOk && !stale;
  }
  setInterval(checkStale, 500);

  const client = mqtt.connect(`ws://${HOST}:${PORT}`, { reconnectPeriod: 2000, connectTimeout: 4000 });

  client.on("connect", () => {
    brokerOk = true;
    $("broker").textContent = `브로커: ${HOST}:${PORT} 연결됨`;
    client.subscribe(TOPIC);
    checkStale();
  });
  client.on("close", () => {
    brokerOk = false;
    $("broker").textContent = `브로커: ${HOST}:${PORT} 끊김`;
    checkStale();
  });

  client.on("message", (topic, payload) => {
    let state;
    try {
      state = JSON.parse(payload.toString());
    } catch (e) {
      return;   // 깨진 메시지는 무시
    }
    if (typeof state.level !== "number") return;
    lastReceived = Date.now();
    $("updated").textContent = "마지막 수신: " + timeText(new Date());
    show(state);
    checkStale();
  });
</script>
</body>
</html>
